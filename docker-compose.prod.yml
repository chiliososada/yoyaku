# ============================================================================
# 本番デプロイ（hpe1）: Kong 配下で 127.0.0.1:3200 に公開
#   初回:   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   マイグレーション: docker compose -f docker-compose.prod.yml --env-file .env.production run --rm worker npx prisma migrate deploy
#   シード（本番: デモ商家なし）: ... run --rm -e SEED_DEMO=false worker npx tsx prisma/seed.ts
# PostgreSQL/Redis はホストへポート公開しない（compose 内部ネットワークのみ）。
# ============================================================================
name: booking-saas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-booking_saas}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking_saas}']
      interval: 5s
      timeout: 5s
      retries: 12
    command: ['postgres', '-c', 'timezone=UTC']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - '127.0.0.1:3200:3000' # Kong service が参照するポート
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_saas}?schema=public&connection_limit=20
      DIRECT_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_saas}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # 店舗ホームページの画像保存先（名前付きボリューム。コンテナ再作成でも保持）
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      # connection_limit を明示（未指定だと Prisma 既定 = CPUコア数*2+1。
      # このホストは 40 コアのため 81 接続を確保しようとし、app(20) と合わせて
      # max_connections=100（うち3はスーパーユーザー予約）を超えて枯渇する）
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_saas}?schema=public&connection_limit=10
      DIRECT_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_saas}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
